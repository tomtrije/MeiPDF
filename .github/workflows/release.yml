name: Release

# Build a signed (or ad-hoc) MeiPDF .app, package it into a DMG, generate the
# signed Sparkle appcast, and publish a GitHub Release with both as assets.
#
# Triggers:
#   - manual workflow_dispatch (recommended): the version is typed into the
#     workflow input; the v<version> tag and the Release are created
#     automatically — no need to push a tag beforehand.
#   - push of a tag like v1.2.3: the version is read from the tag name.
#
# Secrets (all optional — without them you still get an ad-hoc DMG, but no
# notarization and no signed appcast, so auto-update won't work):
#   MACOS_SIGNING_CERT           base64 of a Developer ID Application .p12
#   MACOS_SIGNING_CERT_PASSWORD  password for that .p12
#   APPLE_ID                     your Apple ID email
#   APPLE_APP_PASSWORD           app-specific password for notarization
#   APPLE_TEAM_ID                your 10-char Apple team id
#   SPARKLE_EDKEY                contents of sparkle/ed25519_private.key (base64 seed)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '要发布的版本号，例如 1.0.28。无需提前打 tag，workflow 会自动创建 v<version> 标签并发布 Release。'
        required: true

permissions:
  contents: write

jobs:
  build-dmg:
    runs-on: macos-latest
    # The `if:` conditions below can't read the `secrets` context directly
    # (Actions forbids it), so mirror the (optional) secrets into job-level env
    # and gate the steps with `env.<NAME> != ''` instead.
    env:
      MACOS_SIGNING_CERT: ${{ secrets.MACOS_SIGNING_CERT }}
      MACOS_SIGNING_CERT_PASSWORD: ${{ secrets.MACOS_SIGNING_CERT_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      SPARKLE_EDKEY: ${{ secrets.SPARKLE_EDKEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "!! 无效版本号: '$VERSION'（应为 x.y.z 格式，例如 1.0.28）" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "MEIPDF_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Building MeiPDF $VERSION"

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            ~/.swiftpm
            .build
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Resolve dependencies
        run: swift package resolve

      - name: Import signing certificate
        if: env.MACOS_SIGNING_CERT != ''
        run: |
          echo "$MACOS_SIGNING_CERT" | base64 -D -o cert.p12
          security create-keychain -p "" build.keychain
          security import cert.p12 -k build.keychain -P "$MACOS_SIGNING_CERT_PASSWORD" -T /usr/bin/codesign
          security list-keychains -d user -s build.keychain login.keychain
          security unlock-keychain -p "" build.keychain
          security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain
          IDENTITY=$(security find-identity -v -p codesigning build.keychain | grep "Developer ID Application" | head -1 | awk -F'"' '{print $2}')
          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "Imported identity: $IDENTITY"

      - name: Build app + DMG
        run: bash Scripts/build-dmg.sh

      - name: Notarize DMG
        if: env.MACOS_SIGNING_CERT != ''
        run: |
          DMG="Distribution/MeiPDF-${MEIPDF_VERSION}.dmg"
          xcrun notarytool submit "$DMG" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "$DMG"

      - name: Generate signed appcast
        if: env.SPARKLE_EDKEY != ''
        run: |
          printf '%s' "$SPARKLE_EDKEY" > edkey.txt
          GEN=$(find .build -name generate_appcast | head -1)
          PREFIX="https://github.com/${{ github.repository }}/releases/download/v${MEIPDF_VERSION}/"
          rm -rf Distribution/.caststage && mkdir -p Distribution/.caststage
          cp "Distribution/MeiPDF-${MEIPDF_VERSION}.dmg" Distribution/.caststage/
          "$GEN" --ed-key-file edkey.txt --download-url-prefix "$PREFIX" Distribution/.caststage/
          cp Distribution/.caststage/appcast.xml Distribution/appcast.xml

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${MEIPDF_VERSION}"
          FILES=("Distribution/MeiPDF-${MEIPDF_VERSION}.dmg")
          [ -f Distribution/appcast.xml ] && FILES+=("Distribution/appcast.xml")
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            # Re-run / re-build: refresh the assets on the existing release.
            echo "Release $TAG 已存在，更新资产…"
            gh release upload "$TAG" "${FILES[@]}" --repo "${{ github.repository }}" --clobber
          else
            # Tag is created automatically by gh if it does not exist (via the
            # Git API — no push event, so this workflow won't re-trigger).
            echo "创建 Release $TAG（标签不存在时将自动创建）…"
            gh release create "$TAG" "${FILES[@]}" \
              --repo "${{ github.repository }}" \
              --target "$GITHUB_SHA" \
              --title "MeiPDF ${MEIPDF_VERSION}" \
              --generate-notes \
              --latest
          fi
